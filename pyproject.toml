[project]
name = "sequence-models"
version = "1.0.0"
description = "Cryptocurrency price forecasting with recurrent models, and video violence detection with ResNet50 and ConvLSTM"
requires-python = ">=3.10"
dependencies = [
    "keras>=3.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forecasting*", "violence_detection*"]
